[pytest]
# Forces backend/ onto sys.path before test collection, so `from app...`
# imports work regardless of cwd, shell, or whether any __init__.py files
# happen to exist in the right places. This removes the dependency on
# pytest's automatic rootdir-detection heuristics entirely — same fix
# philosophy as anchoring file paths to Path(__file__) instead of cwd
# elsewhere in this project.
pythonpath = .